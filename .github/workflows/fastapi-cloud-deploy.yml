# Optional token deploy. Production deploys on `main` are done by the
# fastapi-cloud[bot] GitHub integration — this workflow is a fallback.
# GitHub forbids `secrets.*` in job-level `if:`; the guard lives in a step.
name: Deploy to FastAPI Cloud (token fallback)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless FASTAPI_CLOUD_* secrets exist
        id: guard
        env:
          TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: |
          if [ -z "${TOKEN}" ] || [ -z "${APP_ID}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No FASTAPI_CLOUD_TOKEN / APP_ID. Production uses fastapi-cloud[bot]."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: steps.guard.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Deploy to FastAPI Cloud
        if: steps.guard.outputs.skip != 'true'
        run: uv run fastapi deploy --no-wait
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
          FASTAPI_CLOUD_LARGE_FILE_THRESHOLD: "50"
