# Keep FastAPI Cloud awake so WhatsApp open/lunch/close cron can fire.
# Hobby hosts sleep without traffic; this is a best-effort wake until Railway always-on.
name: Desk keepalive

on:
  schedule:
    # Every 5 min during US market + catchup window (≈08:00–18:30 ET ≈ 12:00–22:30 UTC EDT)
    - cron: "*/5 12-22 * * 1-5"
    # Extra pings around the 3 briefing slots (ET → UTC, EDT)
    - cron: "30,32,35,38,40 13 * * 1-5"   # open ~09:35 ET
    - cron: "25,28,30,32,35 16 * * 1-5"   # lunch ~12:30 ET
    - cron: "0,3,5,8,10,15,20 20 * * 1-5" # close ~16:05 ET + late catch-up
  workflow_dispatch:

concurrency:
  group: desk-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake app (/health triggers briefing catch-up)
        run: |
          set -euo pipefail
          URL="${KEEPALIVE_URL:-https://accionesbusqueda.fastapicloud.dev/health}"
          # Also wake Railway URL if configured (always-on primary)
          URLS="$URL"
          if [ -n "${RAILWAY_KEEPALIVE_URL:-}" ]; then
            URLS="$URLS ${RAILWAY_KEEPALIVE_URL}"
          fi
          for u in $URLS; do
            echo "GET $u"
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
              -A "NexBuy-desk-keepalive/1.1" \
              --max-time 60 \
              "$u" || echo "000")
            echo "HTTP $code"
            head -c 400 /tmp/health.json || true
            echo
          done
          # Succeed if primary FastAPI Cloud responded 200 (Railway optional)
          code=$(curl -sS -o /dev/null -w "%{http_code}" -A "NexBuy-desk-keepalive/1.1" --max-time 60 "$URL" || echo "000")
          test "$code" = "200"
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
          RAILWAY_KEEPALIVE_URL: ${{ vars.RAILWAY_KEEPALIVE_URL }}
