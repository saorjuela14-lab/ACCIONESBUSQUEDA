# Best-effort ping of FastAPI Cloud /health.
# GitHub Actions does not guarantee intervals under 5 minutes and may skip
# or delay cron jobs. This workflow runs every 15 minutes on weekdays as a
# backup. The real keepalive should be an external monitor (UptimeRobot or
# similar) hitting https://accionesbusqueda.fastapicloud.dev/health every 5 min.
# Hosting stays on FastAPI Cloud; see README.
name: Desk keepalive

on:
  schedule:
    # GitHub minimum reliable cadence is 5 min and often slower — use 15 min.
    - cron: "*/15 12-22 * * 1-5"
    # Briefing windows (ET→UTC, approx EDT): ~09:35 / 12:30 / 16:05 ET
    - cron: "30 13 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "5 20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: desk-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake app (/health triggers briefing catch-up)
        run: |
          set -euo pipefail
          URL="${KEEPALIVE_URL:-https://accionesbusqueda.fastapicloud.dev/health}"
          echo "GET $URL"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
            -A "Monarch-desk-keepalive/1.2" \
            --max-time 60 \
            "$URL" || echo "000")
          echo "HTTP $code"
          head -c 400 /tmp/health.json || true
          echo
          test "$code" = "200"
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
