# Keep FastAPI Cloud awake so WhatsApp open/lunch/close cron can fire.
# Without this, the host sleeps and briefings only arrive when something wakes the app.
name: Desk keepalive

on:
  schedule:
    # Every 10 min during US market + catchup window (≈08:00–18:30 ET = 12:00–22:30 UTC EDT)
    - cron: "*/10 12-22 * * 1-5"
    # Extra pings around the 3 briefing slots (ET → UTC, EDT)
    - cron: "32,35,40 13 * * 1-5"   # open ~09:35 ET
    - cron: "28,30,35 16 * * 1-5"   # lunch ~12:30 ET
    - cron: "3,5,10,20 20 * * 1-5"  # close ~16:05 ET + late catch-up
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake app (/health triggers briefing catch-up)
        run: |
          set -euo pipefail
          URL="${KEEPALIVE_URL:-https://accionesbusqueda.fastapicloud.dev/health}"
          echo "GET $URL"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
            -A "NexBuy-desk-keepalive/1.0" \
            --max-time 60 \
            "$URL")
          echo "HTTP $code"
          head -c 500 /tmp/health.json || true
          echo
          test "$code" = "200"
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
