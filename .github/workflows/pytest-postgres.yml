name: pytest + Postgres

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:

jobs:
  pytest-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monarch
          POSTGRES_PASSWORD: monarch
          POSTGRES_DB: monarch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monarch -d monarch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://monarch:monarch@localhost:5432/monarch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: pytest lease/attempt on Postgres
        run: python -m pytest -q --tb=short tests/test_pr137_risk_followup.py::test_lease_and_attempt_on_postgres
