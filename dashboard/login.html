<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#012622" />
  <title>Monarch Capital — Acceso</title>
  <link rel="icon" href="/dashboard/static/icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dashboard/static/styles.css?v=11-access-approval" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
</head>
<body class="login-page">
  <script>
    // Kill stale service workers on login too (covers users who never open the terminal)
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    }
  </script>
  <div class="login-card">
    <div class="login-brand">
      <img src="/dashboard/static/assets/logo.png" alt="Monarch Capital" width="280" height="280" />
    </div>
    <p class="muted" style="text-align:center;margin-bottom:0.75rem">Inicia sesión para entrar al terminal</p>

    <div class="login-tabs" role="tablist">
      <button type="button" class="login-tab active" data-tab="company" id="tab-company">Empresa</button>
      <button type="button" class="login-tab" data-tab="desk" id="tab-desk">Mesa</button>
    </div>

    <div id="panel-company" class="login-panel">
      <label for="company-email">Email corporativo</label>
      <input id="company-email" type="email" placeholder="tu@empresa.com" autocomplete="username" />
      <label for="company-password" style="margin-top:0.55rem">Contraseña</label>
      <input id="company-password" type="password" placeholder="Mínimo 8 caracteres" autocomplete="current-password" />
      <button id="btn-login-company" class="btn primary" style="width:100%;margin-top:0.75rem;padding:0.65rem">Entrar</button>
      <details class="login-register" id="register-box" open>
        <summary>Solicitar acceso (nuevo cliente)</summary>
        <p class="muted" style="font-size:12px;margin:0.4rem 0 0.6rem">
          La mesa Monarch debe autorizarte. Luego podrás monitorear la cuenta y solicitar depósito.
          Solo la mesa invierte.
        </p>
        <label for="reg-org">Nombre de la empresa / cliente</label>
        <input id="reg-org" type="text" placeholder="Acme Capital" />
        <label for="reg-name" style="margin-top:0.45rem">Tu nombre</label>
        <input id="reg-name" type="text" placeholder="Ana Pérez" />
        <label for="reg-email" style="margin-top:0.45rem">Email</label>
        <input id="reg-email" type="email" placeholder="tu@empresa.com" />
        <label for="reg-pass" style="margin-top:0.45rem">Contraseña</label>
        <input id="reg-pass" type="password" placeholder="Mínimo 8 caracteres" />
        <button id="btn-register" class="btn" style="width:100%;margin-top:0.65rem">Enviar solicitud</button>
      </details>
    </div>

    <div id="panel-desk" class="login-panel hidden">
      <label for="access-token">Token de mesa Monarch</label>
      <input id="access-token" type="password" placeholder="Token de acceso interno" autocomplete="current-password" />
      <button id="btn-login-desk" class="btn primary" style="width:100%;margin-top:0.75rem;padding:0.65rem">Entrar al terminal</button>
    </div>

    <p id="login-error" class="login-error hidden"></p>
    <p id="login-status" class="muted" style="text-align:center;margin-top:0.75rem;font-size:11px"></p>
  </div>
  <script>
    const API = "/api/v1";
    const err = document.getElementById("login-error");
    const statusEl = document.getElementById("login-status");

    function showErr(msg) {
      err.textContent = msg || "Error";
      err.classList.remove("hidden");
    }
    function clearErr() { err.classList.add("hidden"); err.textContent = ""; }

    function storeSession(token, meta) {
      localStorage.setItem("nexbuy_token", token);
      if (meta) localStorage.setItem("monarch_auth", JSON.stringify(meta));
    }

    function clearSessionLocal() {
      localStorage.removeItem("nexbuy_token");
      localStorage.removeItem("monarch_auth");
    }

    async function validateExistingSession() {
      const params = new URLSearchParams(location.search);
      const forcedOut =
        params.get("logged_out") === "1" ||
        sessionStorage.getItem("monarch_logged_out") === "1";
      if (forcedOut) {
        try { sessionStorage.removeItem("monarch_logged_out"); } catch { /* ignore */ }
        clearSessionLocal();
        // Drop query so a refresh doesn't keep the flag forever, but stay on login
        if (params.get("logged_out") === "1") {
          history.replaceState({}, "", "/login");
        }
        return false;
      }

      const token = localStorage.getItem("nexbuy_token");
      if (!token) return false;
      const headers = { Authorization: `Bearer ${token}` };
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        const me = await fetch(`${API}/auth/me`, {
          headers,
          credentials: "same-origin",
          signal: ctrl.signal,
        });
        if (me.ok) {
          location.replace("/dashboard");
          return true;
        }
      } catch { /* stay on login — cold start / offline */ }
      finally { clearTimeout(timer); }
      // Stale local token — drop it so we don't bounce in a loop
      clearSessionLocal();
      return false;
    }

    document.querySelectorAll(".login-tab").forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll(".login-tab").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        document.getElementById("panel-company").classList.toggle("hidden", tab !== "company");
        document.getElementById("panel-desk").classList.toggle("hidden", tab !== "desk");
        clearErr();
      };
    });

    document.getElementById("btn-login-company").onclick = async () => {
      clearErr();
      const email = document.getElementById("company-email").value.trim();
      const password = document.getElementById("company-password").value;
      try {
        const r = await fetch(`${API}/auth/company/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ email, password }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || "Login incorrecto");
        try { sessionStorage.removeItem("monarch_logged_out"); } catch { /* ignore */ }
        storeSession(data.token, { type: "company", org: data.organization, user: data.user });
        location.replace("/dashboard");
      } catch (e) { showErr(e.message); }
    };

    document.getElementById("btn-login-desk").onclick = async () => {
      clearErr();
      const token = document.getElementById("access-token").value.trim();
      try {
        const r = await fetch(`${API}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ token }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || "Token incorrecto");
        try { sessionStorage.removeItem("monarch_logged_out"); } catch { /* ignore */ }
        storeSession(data.token || token, { type: "desk", user: data.user });
        location.replace("/dashboard");
      } catch (e) { showErr(e.message); }
    };

    document.getElementById("btn-register").onclick = async () => {
      clearErr();
      const body = {
        org_name: document.getElementById("reg-org").value.trim(),
        full_name: document.getElementById("reg-name").value.trim(),
        email: document.getElementById("reg-email").value.trim(),
        password: document.getElementById("reg-pass").value,
      };
      try {
        const r = await fetch(`${API}/auth/companies`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(body),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : "No se pudo enviar la solicitud");
        // Never auto-enter: access must be approved by the mesa
        clearSessionLocal();
        statusEl.textContent = data.message || "Solicitud enviada. Espera autorización de la mesa.";
        statusEl.style.color = "#c4a574";
        err.classList.add("hidden");
        document.getElementById("reg-pass").value = "";
        alert(data.message || "Solicitud enviada. La mesa debe autorizarte antes de entrar.");
      } catch (e) { showErr(e.message); }
    };

    // Show login form immediately; session check runs in background
    statusEl.textContent = "Comprobando sesión…";
    (async () => {
      const ok = await validateExistingSession();
      if (ok) return;
      try {
        const s = await fetch(`${API}/auth/status`, { credentials: "same-origin" }).then((r) => r.json());
        statusEl.textContent = `${s.app_name || "Monarch Capital"} · inicia sesión o solicita acceso`;
      } catch {
        statusEl.textContent = "Servidor despertando… puedes intentar entrar igual";
      }
    })();
  </script>
</body>
</html>
